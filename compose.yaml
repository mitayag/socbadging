name: hau-soc-badging
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    # Loopback-only access supports the disposable local E2E fixture without
    # exposing MariaDB to the LAN.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  migrate:
    build: { context: ., target: tools }
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  media-init:
    image: alpine:3.22
    command: ["chown", "-R", "1001:1001", "/app/storage"]
    volumes:
      - media_data:/app/storage
    restart: "no"
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ISSUER_NAME: ${ISSUER_NAME:-Holy Angel University — School of Computing}
      ISSUER_URL: ${ISSUER_URL:-}
      ISSUER_LOGO_PATH: ${ISSUER_LOGO_PATH:-/images/hausoclogo.png}
      SIGNER_URL: http://signer:3101
      SIGNER_TOKEN: ${SIGNER_TOKEN:?Set a unique internal signer bearer token}
      SIGNER_TIMEOUT_MS: ${SIGNER_TIMEOUT_MS:-5000}
      SIGNING_KEY_ID: ${SIGNING_KEY_ID:?Set the public signing key URL}
      SIGNING_CRYPTOSUITE: ${SIGNING_CRYPTOSUITE:-eddsa-rdfc-2022}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - media_data:/app/storage
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      media-init: { condition: service_completed_successfully }
      signer: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  signer:
    build: { context: ., target: signer }
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    environment:
      SIGNER_TOKEN: ${SIGNER_TOKEN:?Set a unique internal signer bearer token}
      SIGNING_PRIVATE_KEY_PATH: /run/secrets/open-badges-signing-key
      SIGNING_KEY_ID: ${SIGNING_KEY_ID:?Set the public signing key URL}
      SIGNING_PUBLIC_MULTIKEY: ${SIGNING_PUBLIC_MULTIKEY:?Set the registered public Multikey}
      SIGNING_KEY_FINGERPRINT: ${SIGNING_KEY_FINGERPRINT:?Set the registered key fingerprint}
    secrets:
      - source: open_badges_signing_key
        target: open-badges-signing-key
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3101/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  worker:
    build: { context: ., target: worker }
    profiles: ["notifications"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-HAU SOC Badging System <badges@example.edu>}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      NOTIFICATION_POLL_INTERVAL_MS: ${NOTIFICATION_POLL_INTERVAL_MS:-5000}
      NOTIFICATION_CLAIM_LEASE_SECONDS: ${NOTIFICATION_CLAIM_LEASE_SECONDS:-120}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_RETRY_BASE_DELAY_SECONDS: ${NOTIFICATION_RETRY_BASE_DELAY_SECONDS:-60}
      NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-20}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["notifications"]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    expose:
      - "1025"
  seed:
    profiles: ["tools"]
    build: { context: ., target: tools }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ["./node_modules/.bin/tsx", "prisma/seed.ts"]
    depends_on:
      db: { condition: service_healthy }
  integration:
    profiles: ["test"]
    build: { context: ., target: tools }
    environment:
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      APP_URL: ${APP_URL}
    command: ["npm", "run", "test:integration"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

volumes:
  mariadb_data:
  media_data:

secrets:
  open_badges_signing_key:
    file: ${SIGNING_PRIVATE_KEY_FILE:?Set an explicit host path to the signing key file}
